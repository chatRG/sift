# ---------------------------------------------------------------------------
# Sift build settings for a 2-core / 3 GB container (Gradle 9.7.1, AGP 9.1.1).
#
# One JVM does all the work: AGP 9.1.1 has built-in Kotlin support (this build
# applies no `kotlin.android` plugin), so Kotlin, KSP (Hilt + Room) and R8 all
# run inside this daemon.
#
# The cgroup cap is 3 GB and ~1.4 GB is free with the desktop app running, so
# the heap is capped BELOW the free memory: an over-large -Xmx does not fail
# cleanly here, the OOM killer takes the daemon (and the build) with it.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=448m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/opt/data/cache/scratch/tmp
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
kotlin.code.style=official
android.nonTransitiveRClass=true
