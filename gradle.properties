# ---------------------------------------------------------------------------
# Build settings for Sift (Gradle 9.7.1, AGP 9.1.1).
#
# One JVM does all the work: AGP 9.1.1 has built-in Kotlin support (this build
# applies no `kotlin.android` plugin), so Kotlin, KSP (Hilt + Room), Android
# Lint and R8 all run inside this daemon.
#
# Keep this file portable: CI and contributors' machines must be able to use
# it as-is. Machine-specific tuning (a smaller heap, a non-default java.io
# tmpdir on a noexec /tmp) belongs in the environment or in a -D override:
#
#   ./gradlew -Dorg.gradle.jvmargs="-Xmx1280m -Djava.io.tmpdir=/some/exec/tmp"
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
kotlin.code.style=official
android.nonTransitiveRClass=true
