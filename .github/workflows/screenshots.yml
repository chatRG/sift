name: Screenshots

# Captures README screenshots from a real Android emulator. This runs on a
# GitHub-hosted runner because the development container has no /dev/kvm -
# the emulator needs hardware virtualization, which the hosted Linux runner
# provides.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # android-emulator-runner documents this as the KVM permission fix for
      # the ubuntu-latest image.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/capture-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
